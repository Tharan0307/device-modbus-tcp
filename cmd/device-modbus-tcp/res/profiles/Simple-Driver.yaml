name: "SimulatedSensor"
manufacturer: "EdgeX-Demo"
model: "SIM-1000"
description: "Simulated industrial sensor - temperature, pressure, humidity"
labels:
  - modbus
  - simulator

deviceResources:

  - name: Temperature
    description: "Temperature in degrees Celsius (raw INT16 / 10)"
    properties:
      valueType: Float32
      readWrite: R
      units: "C"
      scale: 0.1
    attributes:
      primaryTable: "HOLDING_REGISTERS"
      startingAddress: "0"
      rawType: "INT16"

  - name: Pressure
    description: "Pressure in kPa (raw INT16 / 10)"
    properties:
      valueType: Float32
      readWrite: R
      units: "kPa"
      scale: 0.1
    attributes:
      primaryTable: "HOLDING_REGISTERS"
      startingAddress: "1"
      rawType: "INT16"

  - name: Humidity
    description: "Relative humidity percent (raw INT16 / 10)"
    properties:
      valueType: Float32
      readWrite: R
      units: "%RH"
      scale: 0.1
    attributes:
      primaryTable: "HOLDING_REGISTERS"
      startingAddress: "2"
      rawType: "INT16"

  - name: DeviceStatus
    description: "Device operational status - true means OK"
    properties:
      valueType: Bool
      readWrite: R
    attributes:
      primaryTable: "COILS"
      startingAddress: "0"

deviceCommands:

  - name: AllReadings
    readWrite: R
    resourceOperations:
      - deviceResource: Temperature
      - deviceResource: Pressure
      - deviceResource: Humidity
      - deviceResource: DeviceStatus

  - name: EnvironmentalData
    readWrite: R
    resourceOperations:
      - deviceResource: Temperature
      - deviceResource: Pressure
      - deviceResource: Humidity
